name: Generate PROJECT-SYNC.json

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-project-sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PROJECT-SYNC.json
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          TODAY=$(date -u '+%Y-%m-%d')
          ACTOR="${{ github.actor }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          VERSION=$(node -p "require('./package.json').version")

          cat > PROJECT-SYNC.json << ENDJSON
          {
            "project": "SmartPress",
            "repo": "AliMora83/SmartPress",
            "branch": "main",
            "stack": "TypeScript / Next.js 16 / React 19 / Tailwind CSS — fully client-side",
            "status": "Active",
            "priority": 2,
            "priority_label": "🟡 Priority 2 — Active Development",
            "progress_percent": 35,
            "progress_label": "v3 rebuild — backend removed, codec layer next",
            "current_phase": "Phase 1 — Strip & Rebuild the Core",
            "next_step": "Sprint 1.2 — codec layer (wasm encoders, CodecSpec, worker pool)",
            "blocker": null,
            "live_url": "https://smartpress.namka.cloud",
            "deploy_target": "Static frontend — namka.cloud",
            "agents": ["Claude", "Comet"],
            "version": "$VERSION",
            "last_push": {
              "timestamp": "$TIMESTAMP",
              "actor": "$ACTOR",
              "commit_message": "$COMMIT_MSG",
              "sha": "$SHORT_SHA"
            },
            "last_updated": "$TODAY"
          }
          ENDJSON

          sed -i 's/^          //' PROJECT-SYNC.json
          echo "PROJECT-SYNC.json generated."

      - name: Commit PROJECT-SYNC.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git diff --quiet PROJECT-SYNC.json || (
            git add PROJECT-SYNC.json &&
            git commit -m "chore: update PROJECT-SYNC.json [skip ci]" &&
            git push
          )
